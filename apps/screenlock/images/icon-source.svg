<?xml version="1.0" encoding="UTF-8"?>
<!-- Screen & Lock header / launcher icon: sun and lock on a tile. Drawn for
     this card so we do not ship HP's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="sun" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4c0"/>
      <stop offset="45%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#b06a08"/>
    </radialGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#6a7684"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M9 33.5 L24 41 L39 33.5 L24 26 Z" fill="#4a4a4a"/>
  <path d="M9 33.5 L24 41 L24 43.5 L9 36 Z" fill="#2e2e2e"/>
  <path d="M39 33.5 L24 41 L24 43.5 L39 36 Z" fill="#1a1a1a"/>
  <!-- sun -->
  <g transform="translate(14,10)">
    <circle cx="10" cy="10" r="7.2" fill="url(#sun)"/>
    <g stroke="#c88810" stroke-width="1.4" stroke-linecap="round">
      <path d="M10 0.8 V2.6"/><path d="M10 17.4 V19.2"/>
      <path d="M0.8 10 H2.6"/><path d="M17.4 10 H19.2"/>
      <path d="M3.4 3.4 L4.7 4.7"/><path d="M15.3 15.3 L16.6 16.6"/>
      <path d="M16.6 3.4 L15.3 4.7"/><path d="M4.7 15.3 L3.4 16.6"/>
    </g>
    <circle cx="10" cy="10" r="7.2" fill="url(#shine)"/>
  </g>
  <!-- small lock -->
  <g transform="translate(26,22)">
    <path d="M4.5 6.5 V4.2 a3 3 0 0 1 6 0 V6.5" fill="none"
          stroke="#c8d0d8" stroke-width="1.7" stroke-linecap="round"/>
    <rect x="2.8" y="6" width="9.4" height="8.2" rx="1.3" fill="url(#lock)"
          stroke="#3a4450" stroke-width="0.5"/>
    <circle cx="7.5" cy="10" r="1" fill="#2a323a"/>
    <rect x="7" y="10" width="1" height="2.2" rx="0.3" fill="#2a323a"/>
  </g>
</svg>
