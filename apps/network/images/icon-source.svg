    <ellipse cx="24" cy="22" rx="6.5" ry="14.5"/>
    <ellipse cx="24" cy="22" rx="14.5" ry="5.8"/>
    <path d="M10 16.5 Q24 12 38 16.5"/>
    <path d="M10 27.5 Q24 32 38 27.5"/>
  </g>
  <ellipse cx="24" cy="22" rx="15" ry="15" fill="url(#shine)"/>
  <path d="M30 28 Q36 24 38 18" fill="none" stroke="#f0c040" stroke-width="2.2"
        stroke-linecap="round"/>
  <circle cx="38" cy="17" r="2.2" fill="#f0c040"/>
