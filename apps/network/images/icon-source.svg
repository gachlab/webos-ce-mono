<?xml version="1.0" encoding="UTF-8"?>
<!-- Networking header / launcher icon: globe with a link arc. Drawn for this
     card so we do not ship HP's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="g" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#d4f0ff"/>
      <stop offset="40%" stop-color="#3a9ad4"/>
      <stop offset="100%" stop-color="#0d4a7a"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="24" cy="22" r="15"/></clipPath>
  </defs>
  <path d="M8 35 L24 43 L40 35 L24 27 Z" fill="#4a4a4a"/>
  <path d="M8 35 L24 43 L24 45.5 L8 37.5 Z" fill="#2e2e2e"/>
