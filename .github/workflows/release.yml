# Builds the .deb and attaches it to a GitHub Release.
#
# Runs on the self-hosted runner, not on GitHub's, and deliberately: a full
# build of this tree is 29 components plus a 2.5GB container image, which is
# minutes of CPU that would come out of the account's quota on every tag. The
# runner already has the image cached after the first run.
#
# Tags only. A release is something you decide to make, so this does not fire on
# every push -- and on a self-hosted runner that also means no workflow from an
# outside contributor's branch can run on the machine. workflow_dispatch is here
# for re-cutting a release without moving a tag.
#
# Every action below is pinned to a major that declares `using: node24`. Node 20
# pins still run -- GitHub forces them onto the Node 24 runtime and warns -- but
# that compatibility is temporary. checkout and upload-artifact reached node24
# in v5, action-gh-release in v3. upload-artifact v6 and up also require an
# Actions Runner of at least 2.327.1; this one reports 2.337.0.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # the release upload needs it; nothing else does

jobs:
  package:
    # Named for what it produces rather than for what it produced first. This
    # job built only the .deb when it was written and the key stayed `deb` after
    # the AppImage was added, which reads in the Actions UI as though the
    # AppImage were missing -- someone watching a run reasonably concluded
    # exactly that. The display name says both out loud.
    #
    # Safe to rename: nothing uses `needs:`, master is unprotected with no
    # rulesets, so no required status check is pinned to the old name, and the
    # `steps.deb.outputs.*` references point at the step whose id is `deb`,
    # which is a different namespace and keeps its name.
    name: .deb and AppImage
    # Every self-hosted runner carries these three labels automatically, so this
    # matches without depending on whatever custom labels it was registered with.
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          # tools/mkdeb.sh derives the package version from git --
          # 3.0.5-0+<commit count>.<short sha> -- and a shallow clone gives the
          # wrong count. This is why fetch-depth matters here and would not in a
          # workflow that only compiles.
          fetch-depth: 0

      - name: Check the container runtime is there
        run: |
          command -v docker >/dev/null || command -v podman >/dev/null || {
            echo "neither docker nor podman on the runner; mkdeb.sh cannot build" >&2
            exit 1
          }
          docker info >/dev/null 2>&1 || podman info >/dev/null 2>&1 || {
            echo "a container runtime is installed but not usable by this user" >&2
            exit 1
          }

      - name: Build the package
        # The first run also builds the ubuntu:26.04 image with the whole
        # toolchain, which is slow; afterwards it is cached on the runner.
        run: tools/mkdeb.sh

      - name: Say what was built
        id: deb
        run: |
          set -e
          path="$(ls -t dist/*.deb | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "### $(basename "$path")" >> "$GITHUB_STEP_SUMMARY"
          dpkg-deb --info "$path" | sed -n 's/^ \(Version\|Installed-Size\):/\1:/p' \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the package even if the release step fails
        # Before the AppImage is built, deliberately. This step exists to make
        # sure a finished package survives a later failure, and building the
        # AppImage first would have made a broken mkappimage.sh throw away a
        # perfectly good .deb -- the exact thing this is here to prevent.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deb.outputs.name }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Build the AppImage
        id: appimage
        # Made out of the .deb that was just built, not from a second build of
        # the tree: mkappimage.sh unpacks that package and adds an AppRun, so
        # the two artifacts are the same bits and cannot drift apart.
        #
        # This step runs on the runner itself rather than in the container, so
        # it needs two things the .deb build did not: dpkg-deb to unpack, and
        # network to fetch appimagetool. Checked here so a missing one fails
        # with a sentence instead of a stack of shell errors.
        run: |
          set -e
          command -v dpkg-deb >/dev/null || {
            echo "dpkg-deb is needed to unpack the package; install dpkg-dev" >&2
            exit 1
          }
          tools/mkappimage.sh "${{ steps.deb.outputs.path }}"
          path="$(ls -t dist/*.AppImage | head -1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "### $(basename "$path")" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the AppImage too
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.appimage.outputs.name }}
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
          body: |
            Built from ${{ github.sha }} by the release workflow. Two artifacts,
            the same bits: the AppImage is made from the .deb rather than from a
            second build of the tree.

            **Package** — `sudo apt-get install ./${{ steps.deb.outputs.name }}`.
            apt resolves the dependencies, which are computed from the binaries
            themselves by dpkg-shlibdeps rather than written by hand. Installs
            self-contained under `/opt/webos-ce`; start it with
            `/opt/webos-ce/bin/webos-ce`.

            **AppImage** — `chmod +x ${{ steps.appimage.outputs.name }}` and run
            it. It needs `bubblewrap` on the host and nothing else: the tree
            carries `/opt/webos-ce` compiled into 24 of its binaries and cannot
            be relocated, so the AppImage binds itself there inside a private
            mount namespace, which needs no privileges and leaves the host
            untouched. Its writable state lives in `$XDG_DATA_HOME/webos-ce` and
            survives restarts.
