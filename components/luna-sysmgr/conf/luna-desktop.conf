[General]
ShowReticle=true
PackageManifestsPath=/tmp/webos
ScreenCapturesPath=/tmp/webos/captures
LogFileName=/tmp/webos/lunasysmgr.log
ShowNotificationsAtTop=true
DisplayWidth=1280
DisplayHeight=960
GestureAreaHeight=40

[UI]
TabletUi=true
DisplayUiRotates=true
ActiveCardWindowRatio=0.55
NonActiveCardWindowRatio=0.50
CardGroupRotFactor=90
GapBetweenCardGroups=30
CardGroupingXDistanceFactor=0.35
ModalWindowWidth=320
ModalWindowHeight=480
EnableSplashBackgrounds=false
SplashIconSize=192

[VirtualKeyboard]
# Off by default in code (Settings.cpp:189) and in both shipped configs, which
# is what kept the on-screen keyboard from ever existing here: WindowServerLuna
# only builds an InputWindowManager when this is set (line 142), that is what
# owns the IMEManager, and IMEManager only searches /usr/lib/luna for keyboard
# plugins when someone asks it to create one -- which nothing did. The efigs
# plugins are installed and were never loaded.
#
# Turning it on draws a keyboard that cannot be typed on, and that is worse than
# no keyboard: tapping it dismisses itself. MEASURED with WEBOS_TRACE_IME=1 and
# WEBOS_TRACE_TOUCH=1 -- over a session, 10 "VIEWPORT TouchBegin" and exactly 0
# "IMEVIEW TouchBegin". Every touch is consumed by the desktop-port block in
# WindowServerLuna::sysmgrEventFilters, which hands the whole screen to the
# launcher overlay while Just Type is up, so QGraphicsScene never delivers to
# the IMEView at all. See KNOWN_BUGS.md. Off until that block asks whether the
# point belongs to the IME.
VirtualKeyboardEnabled=false
